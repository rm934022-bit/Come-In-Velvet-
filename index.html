<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Come In, Velvet!</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:ital,wght@0,500;0,600;0,700;1,600&family=Silkscreen:wght@400;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="app-wrapper">
    <!-- Main GameMaker Viewport Frame -->
    <main class="game-stage">
      <div class="canvas-container" id="canvas-container">
        <!-- Subtle In-Frame Top Bezel Controls -->
        <div class="gm-bezel-bar">
          <div class="gm-bezel-title">COME IN, VELVET! <span class="gm-ver">v1.0</span></div>
          <div class="gm-bezel-actions">
            <button id="btn-pause" class="gm-btn-tiny">[ESC] MENU</button>
            <button id="btn-guestbook" class="gm-btn-tiny">[TAB] GUEST LEDGER</button>
            <button id="btn-mute" class="gm-btn-tiny">[M] SOUND: ON</button>
            <button id="btn-restart" class="gm-btn-tiny">[R] RESET</button>
          </div>
        </div>

        <canvas id="game-canvas" width="1280" height="720"></canvas>

        <!-- GameMaker RPG-Style Interrogation Dialogue Box -->
        <div id="question-modal" class="gm-dialogue-box hidden">
          <!-- Top Strip: Step Tabs + Rules Toggle -->
          <div class="gm-dlg-topbar">
            <div class="gm-step-tabs">
              <span class="gm-label">CHECK:</span>
              <button class="step-dot" id="step-dot-1">[1] TICKET</button>
              <button class="step-dot" id="step-dot-2">[2] PASSWORD</button>
              <button class="step-dot" id="step-dot-3">[3] BOOTS</button>
            </div>

            <div id="qm-clues-strip" class="gm-clues-strip">
              <span class="clue-placeholder">PRESS [SPACE] TO INTERROGATE</span>
            </div>

            <div class="gm-dlg-tools">
              <button id="btn-peek-rules" class="gm-btn-small">RULES (<span id="qm-hour-label">9:00 PM</span>)</button>
              <button id="qm-close" class="gm-btn-close" title="Step Back [ESC]">X</button>
            </div>
          </div>

          <!-- Collapsible Parchment Rules Note -->
          <div id="qm-rules-popover" class="gm-rules-note hidden">
            <div class="gm-note-title">GATEKEEPER ORDERS</div>
            <div id="qm-rules-content" class="qm-rules-scroll"></div>
          </div>

          <!-- Main RPG Portrait & Dialogue Stage -->
          <div class="gm-dlg-main">
            <!-- Left Portrait: Velvet -->
            <div class="gm-portrait-box velvet-box" id="qm-velvet-card">
              <div class="gm-portrait-frame">
                <canvas id="qm-velvet-portrait" width="96" height="96"></canvas>
              </div>
              <div class="gm-nameplate">VELVET</div>
              <div class="gm-moodplate" id="qm-velvet-mood">GATEKEEPER</div>
            </div>

            <!-- Center Text Box -->
            <div class="gm-textbox-col">
              <!-- Velvet's Prompt Line -->
              <div id="qm-velvet-bubble" class="gm-velvet-line hidden">
                <span class="gm-speaker-tag">VELVET:</span>
                <span id="qm-velvet-text">"Hold it! Name and ticket, please!"</span>
              </div>

              <!-- Physical Ticket / Evidence Slip -->
              <div id="qm-evidence-prop" class="gm-evidence-slip hidden"></div>

              <!-- Visitor's Speech Box -->
              <div id="qm-guest-bubble" class="gm-speech-box">
                <div class="gm-speaker-header" id="qm-speaker-label">VISITOR:</div>
                <p id="qm-speech-text">"Trick or treat! Let me into the party, Velvet!"</p>
                <span class="gm-blink-cursor">▼</span>
              </div>
            </div>

            <!-- Right Portrait: Visitor -->
            <div class="gm-portrait-box guest-box" id="qm-guest-card">
              <div class="gm-portrait-frame">
                <canvas id="qm-portrait" width="106" height="106"></canvas>
                <div id="qm-scan-beam" class="qm-scan-beam hidden"></div>
              </div>
              <div class="gm-nameplate" id="qm-guest-name">???</div>
              <div class="gm-moodplate" id="qm-guest-costume">UNKNOWN</div>
            </div>
          </div>

          <!-- Bottom Command Bar -->
          <div class="gm-dlg-footer">
            <button id="btn-next-question" class="gm-cmd-btn next-cmd">
              ► ASK QUESTION 1/3: TICKET &amp; ID [SPACE]
            </button>

            <div class="gm-verdict-cmds">
              <button id="btn-admit" class="gm-cmd-btn admit-cmd">
                [F] ADMIT GUEST
              </button>
              <button id="btn-reject" class="gm-cmd-btn reject-cmd">
                [X] UNINVITED!
              </button>
            </div>
          </div>
        </div>

        <!-- Parchment Guestbook Ledger (Toggle with TAB) -->
        <aside id="guestbook-drawer" class="gm-ledger-drawer hidden">
          <div class="gm-ledger-header">
            <h3>GATEKEEPER LEDGER</h3>
            <button id="gb-close" class="gm-btn-close">X</button>
          </div>
          <div id="gb-body" class="gb-body"></div>
        </aside>
      </div>
    </main>
  </div>

  <!-- Game Scripts -->
  <script src="js/audio.js"></script>
  <script src="js/data.js"></script>
  <script src="js/level.js"></script>
  <script src="js/entities.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/game.js"></script>
</body>
</html>
